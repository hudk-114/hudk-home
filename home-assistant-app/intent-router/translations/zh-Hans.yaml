configuration:
  minimax_api_key:
    name: MiniMax API Key
    description: MiniMax Token Plan 对应的 API Key，仅保存在 HA App 配置中。
  shared_secret:
    name: OpenClaw 共享密钥
    description: 调用 8787 API 时使用的 Bearer 密钥，建议至少 32 字节随机值。
  minimax_model:
    name: MiniMax 模型
    description: 用于规则无法确定命中时的意图分类模型。
  minimax_thinking:
    name: 推理模式
    description: 意图分类建议选择 disabled。
  minimax_timeout_ms:
    name: MiniMax 超时（毫秒）
    description: 单次意图分类调用的最大等待时间。
  minimax_max_completion_tokens:
    name: MiniMax 最大输出 Token
    description: 意图 JSON 的最大输出长度。
  discovery_enabled:
    name: 自动发现 HA 能力
    description: 从带 intent_router 标签的 HA 实体构建受限能力目录。
  default_dry_run:
    name: 默认调试模式
    description: 未显式指定时只解析，不执行设备操作。
  allow_live_execution:
    name: 允许真实执行
    description: 总开关；开启后，请求仍需显式关闭 dry-run。
network:
  8787/tcp: OpenClaw 和其他受认证文字入口
