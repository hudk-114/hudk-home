name: Intent Router

on:
  workflow_dispatch:
  push:
    paths:
      - "intent-router/**"
      - "config/**"
      - "contracts/**"
      - "home-assistant-app/**"
      - "repository.yaml"
      - "tests/**"
      - ".github/workflows/intent-router.yml"
  pull_request:
    paths:
      - "intent-router/**"
      - "config/**"
      - "contracts/**"
      - "home-assistant-app/**"
      - "repository.yaml"
      - "tests/**"
      - ".github/workflows/intent-router.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intent-router
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: intent-router/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify App and package versions match
        run: |
          package_version=$(node -p "require('./package.json').version")
          app_version=$(sed -n 's/^version: "\([^"]*\)"/\1/p' ../home-assistant-app/intent-router/config.yaml)
          test "$package_version" = "$app_version"

  publish-app-image:
    name: Publish ${{ matrix.ha_arch }} App image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: amd64
            platform: linux/amd64
          - ha_arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: app
        name: Read App version
        run: |
          echo "version=$(sed -n 's/^version: \"\([^\"]*\)\"/\1/p' home-assistant-app/intent-router/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: intent-router/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.app.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}
          tags: |
            ghcr.io/hudk-114/hudk-home-intent-router:${{ matrix.ha_arch }}-${{ steps.app.outputs.version }}
          cache-from: type=gha,scope=intent-router-${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=intent-router-${{ matrix.ha_arch }}

  publish-app-manifest:
    name: Publish multi-architecture App manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-app-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: app
        name: Read App version
        run: |
          echo "version=$(sed -n 's/^version: \"\([^\"]*\)\"/\1/p' home-assistant-app/intent-router/config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Publish version and latest manifests
        env:
          VERSION: ${{ steps.app.outputs.version }}
          IMAGE: ghcr.io/hudk-114/hudk-home-intent-router
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:amd64-${VERSION}" \
            "${IMAGE}:aarch64-${VERSION}"

  publish-swr-image:
    name: Publish ${{ matrix.ha_arch }} SWR mirror
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.SWR_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: amd64
            platform: linux/amd64
          - ha_arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: swr.cn-east-3.myhuaweicloud.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - id: app
        name: Read App version
        run: |
          echo "version=$(sed -n 's/^version: \"\([^\"]*\)\"/\1/p' home-assistant-app/intent-router/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: intent-router/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          build-args: |
            BUILD_VERSION=${{ steps.app.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}
          outputs: >-
            type=image,name=swr.cn-east-3.myhuaweicloud.com/hudk-home/intent-router:${{ matrix.ha_arch }}-${{ steps.app.outputs.version }},push=true,oci-mediatypes=false
          cache-from: type=gha,scope=intent-router-${{ matrix.ha_arch }}

  publish-swr-manifest:
    name: Publish multi-architecture SWR mirror
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.SWR_ENABLED == 'true'
    needs: publish-swr-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: swr.cn-east-3.myhuaweicloud.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - id: app
        name: Read App version
        run: |
          echo "version=$(sed -n 's/^version: \"\([^\"]*\)\"/\1/p' home-assistant-app/intent-router/config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Publish version and latest Docker manifest lists
        env:
          VERSION: ${{ steps.app.outputs.version }}
          IMAGE: swr.cn-east-3.myhuaweicloud.com/hudk-home/intent-router
        run: |
          docker manifest create --amend --insecure "${IMAGE}:${VERSION}" \
            "${IMAGE}:amd64-${VERSION}" \
            "${IMAGE}:aarch64-${VERSION}"
          docker manifest annotate "${IMAGE}:${VERSION}" \
            "${IMAGE}:amd64-${VERSION}" --os linux --arch amd64
          docker manifest annotate "${IMAGE}:${VERSION}" \
            "${IMAGE}:aarch64-${VERSION}" --os linux --arch arm64
          docker manifest push "${IMAGE}:${VERSION}"
          docker manifest create --amend --insecure "${IMAGE}:latest" \
            "${IMAGE}:amd64-${VERSION}" \
            "${IMAGE}:aarch64-${VERSION}"
          docker manifest annotate "${IMAGE}:latest" \
            "${IMAGE}:amd64-${VERSION}" --os linux --arch amd64
          docker manifest annotate "${IMAGE}:latest" \
            "${IMAGE}:aarch64-${VERSION}" --os linux --arch arm64
          docker manifest push "${IMAGE}:latest"
