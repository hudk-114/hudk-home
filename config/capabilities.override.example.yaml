version: 1

# 复制为 config/capabilities.local.yaml，并把该文件加入
# intent-router 配置的 files.capability_overlays。local 文件不会进入 Git。
targets:
  main_vacuum:
    area: replace_with_real_area

capabilities:
  vacuum.start:
    verification_entity_id: vacuum.replace_with_real_entity_id

  vacuum.dock:
    verification_entity_id: vacuum.replace_with_real_entity_id

policies: {}
